context:
  version: "0.25.0"

package:
  name: cubic
  version: ${{ version }}

source:
  url: https://github.com/cubic-vm/cubic/archive/refs/tags/v${{ version }}.tar.gz
  sha256: b1aa0d2ec689a37e2399928fedeb053d3fca1efd052f6d765a13949535af05ad

build:
  number: 0
  script:
    env:
      AWS_LC_SYS_CMAKE_BUILDER: ${{ 1 if win else 0 }} # force CMake builder for `aws-lc-sys` native C/C++ code on Windows
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    interpreter: nu
    content:
      - let prefix = $env.LIBRARY_PREFIX? | default $env.PREFIX
      # build main app and generate license data
      - cargo auditable install --path=. --root=($prefix) --no-track --locked --bins
      - cargo-bundle-licenses --format=yaml --output=THIRDPARTY.yml
      # generate shell completions
      - if: build_platform == host_platform
        then:
          - mkdir ($prefix)/share/bash-completion/completions ($prefix)/share/fish/vendor_completions.d ($prefix)/share/zsh/site-functions
          - let bin = ($prefix)/bin/cubic
          # `XDG_RUNTIME_DIR` must be set (to a writable directory) when running `cubic` on Linux (setting `UID` would require `/run/user/<UID>` being *writable* which it is not in containerized builds)
          - if: linux
            then: $env.XDG_RUNTIME_DIR = $env.XDG_RUNTIME_DIR? | default ($env.HOME)/.cache
          - ^$bin completions bash | save ($prefix)/share/bash-completion/completions/cubic
          - ^$bin completions fish | save ($prefix)/share/fish/vendor_completions.d/cubic.fish
          - ^$bin completions zsh  | save ($prefix)/share/zsh/site-functions/_cubic

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - nushell
    - if: win
      then:
        - cmake
        - nasm

tests:
  - script:
      - cubic --help
      - cubic --version
  - package_contents:
      bin:
        - cubic
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/bash-completion/completions/cubic
            - share/fish/vendor_completions.d/cubic.fish
            - share/zsh/site-functions/_cubic
        - if: win and build_platform == host_platform
          then:
            - Library/share/bash-completion/completions/cubic
            - Library/share/fish/vendor_completions.d/cubic.fish
            - Library/share/zsh/site-functions/_cubic
      strict: true

about:
  summary: A lightweight command line manager for virtual machines
  description: |
    Cubic is a lightweight command line manager for virtual machines. It has a
    simple, daemonless and rootless design. All Cubic virtual machines run isolated
    in the user context. Cubic is built on top of QEMU, KVM and cloud-init.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
    - THIRDPARTY.yml
  homepage: https://cubic-vm.org
  repository: https://github.com/cubic-vm/cubic

extra:
  recipe-maintainers:
    - salim-b
