context:
  version: "0.25.0"

package:
  name: cubic
  version: ${{ version }}

source:
  url: https://github.com/cubic-vm/cubic/archive/refs/tags/v${{ version }}.tar.gz
  sha256: b1aa0d2ec689a37e2399928fedeb053d3fca1efd052f6d765a13949535af05ad

build:
  number: 0
  script:
    env:
      AWS_LC_SYS_CMAKE_BUILDER: ${{ "1" if win else "0" }} # force CMake builder for `aws-lc-sys` native C/C++ code on Windows
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_STRIP: symbols
    content:
      - if: unix
        then:
          - cargo auditable install --path=. --root="$PREFIX" --no-track --locked --bins
          # generate shell completions
          - if: build_platform == host_platform
            then:
              - mkdir -p "$PREFIX"/share/bash-completion/completions "$PREFIX"/share/fish/vendor_completions.d "$PREFIX"/share/zsh/site-functions
              - 'XDG_RUNTIME_DIR=/tmp/runtime "$PREFIX"/bin/cubic completions bash > "$PREFIX"/share/bash-completion/completions/cubic'
              - 'XDG_RUNTIME_DIR=/tmp/runtime "$PREFIX"/bin/cubic completions fish > "$PREFIX"/share/fish/vendor_completions.d/cubic.fish'
              - 'XDG_RUNTIME_DIR=/tmp/runtime "$PREFIX"/bin/cubic completions zsh  > "$PREFIX"/share/zsh/site-functions/_cubic'
      - if: win
        then:
          - cargo auditable install --path=. --root="%LIBRARY_PREFIX%" --no-track --locked --bins
          # generate shell completions
          - if: build_platform == host_platform
            then:
              - mkdir "%LIBRARY_PREFIX%\share\bash-completion\completions"
              - mkdir "%LIBRARY_PREFIX%\share\fish\vendor_completions.d"
              - mkdir "%LIBRARY_PREFIX%\share\zsh\site-functions"
              - '"%LIBRARY_BIN%"\cubic.exe completions bash > "%LIBRARY_PREFIX%"\share\bash-completion\completions\cubic'
              - '"%LIBRARY_BIN%"\cubic.exe completions fish > "%LIBRARY_PREFIX%"\share\fish\vendor_completions.d\cubic.fish'
              - '"%LIBRARY_BIN%"\cubic.exe completions zsh  > "%LIBRARY_PREFIX%"\share\zsh\site-functions\_cubic'
      - cargo-bundle-licenses --format=yaml --output=./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-auditable
    - cargo-bundle-licenses
    - if: win
      then:
        - cmake
        - nasm

tests:
  - script:
      - cubic --help
      - cubic --version
  - package_contents:
      bin:
        - cubic
      files:
        - if: unix and build_platform == host_platform
          then:
            - share/bash-completion/completions/cubic
            - share/fish/vendor_completions.d/cubic.fish
            - share/zsh/site-functions/_cubic
        - if: win and build_platform == host_platform
          then:
            - Library/share/bash-completion/completions/cubic
            - Library/share/fish/vendor_completions.d/cubic.fish
            - Library/share/zsh/site-functions/_cubic
      strict: true

about:
  summary: A lightweight command line manager for virtual machines
  description: |
    Cubic is a lightweight command line manager for virtual machines. It has a
    simple, daemonless and rootless design. All Cubic virtual machines run isolated
    in the user context. Cubic is built on top of QEMU, KVM and cloud-init.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
    - THIRDPARTY.yml
  homepage: https://cubic-vm.org
  repository: https://github.com/cubic-vm/cubic

extra:
  recipe-maintainers:
    - salim-b
